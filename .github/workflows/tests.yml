name: tests
on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: docker
      run: |
        # run the database in docker container
        docker compose up -d --build

        # verify that it is running successfully
        docker ps -a

        # wait until the pagila data has finished loading
        for i in $(seq 1 60); do
          if docker compose logs pg | grep -q 'PostgreSQL init process complete'; then
            break
          fi
          sleep 2
        done
        sleep 5

        # run the tests
        docker compose exec -T pg ./run_tests.sh
